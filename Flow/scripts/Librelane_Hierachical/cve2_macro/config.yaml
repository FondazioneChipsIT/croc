LINTER_VLT: dir::./verilator_cfg.vlt

VERILOG_DEFINES: [FUNCTIONAL]

# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--compat-mode','--allow-use-before-declare','--ignore-unknown-modules']

# Valid values are AREA 0-3 and DELAY 0-4
# DELAY 4 = fastest, but largest area
# AREA 3 = slowest, but smallest area
SYNTH_STRATEGY: DELAY 4

# SDC files
PNR_SDC_FILE: dir::constraints_cve2.sdc
SIGNOFF_SDC_FILE: dir::constraints_cve2.sdc
FALLBACK_SDC: dir::constraints_cve2.sdc

# Clock
CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 15 # 66.6 MHz

# Floorplan
DIE_AREA: [0, 0, 1000, 500]
IO_PIN_ORDER_CFG: dir::pin_order.cfg
FP_SIZING: absolute

# PDN
PDN_MULTILAYER: False
VDD_NETS: ["VDD"]
GND_NETS: ["VSS"]
VERILOG_POWER_DEFINE: "USE_POWER_PINS"

# Placement 
PL_TARGET_DENSITY_PCT: 60
PL_TIMING_DRIVEN: True
PL_ROUTABILITY_DRIVEN: True
PL_ROUTABILITY_OVERFLOW_THRESHOLD: 0.3
PL_OPTIMIZE_MIRRORING: True

# CTS
RUN_CTS: true
CTS_ROOT_BUFFER: sg13g2_buf_8
CTS_CLK_BUFFERS: ["sg13g2_buf_2","sg13g2_buf_4","sg13g2_buf_8","sg13g2_buf_16"]

# Routing
GRT_ALLOW_CONGESTION: true
GRT_ANTENNA_REPAIR_MARGIN: 30
RT_MAX_LAYER: Metal5
RT_CLOCK_MIN_LAYER: Metal1
RT_CLOCK_MAX_LAYER: Metal5
# Potentially leave some antennas after DRT to avoid pin access error bug
DRT_ANTENNA_REPAIR_ITERS: 0

# Timing
RUN_POST_CTS_RESIZER_TIMING: True
RUN_POST_GRT_RESIZER_TIMING: True
DESIGN_REPAIR_MAX_SLEW_PCT: 0
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 0
# Fix setup violations
PL_RESIZER_SETUP_REPAIR_TNS_PCT: 100
PL_RESIZER_SETUP_SLACK_MARGIN: 1.00
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 100
GRT_RESIZER_SETUP_REPAIR_TNS_PCT: 100
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.95
GRT_RESIZER_SETUP_MAX_BUFFER_PCT: 100
# Fix hold violations
PL_RESIZER_HOLD_REPAIR_TNS_PCT: 100
PL_RESIZER_HOLD_SLACK_MARGIN: 0.1
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05

RUN_MAGIC_DRC: true
